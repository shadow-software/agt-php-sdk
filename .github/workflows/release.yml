name: Release

on:
  repository_dispatch:
    types: [spec-updated]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (SDK-only patch, e.g. 3.2.1)"
        required: true
        type: string
      dry_run:
        description: "Build and test but do not publish"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Generate, build, test, publish
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["ubuntu-latest"]') }}
    steps:
      - name: Checkout SDK package
        uses: actions/checkout@v7

      - name: Checkout private sdk-release (scripts + composite action)
        uses: actions/checkout@v7
        with:
          repository: shadow-software/sdk-release
          path: .sdk-release
          token: ${{ secrets.SDK_RELEASE_TOKEN }}

      # consumer_repo/consumer_dispatch_token: agt-for-woocommerce depends on
      # this package via Composer. The composite action already fires
      # repository_dispatch (sdk-updated) to a consumer repo after a real
      # publish — reused here rather than hand-rolling the same curl call a
      # second time (an earlier pass here duplicated it as a one-off "Notify
      # agt-for-woocommerce" step; removed in favour of this).
      - name: Generate, build, test, publish
        uses: ./.sdk-release/.github/actions/release
        with:
          language: php
          package_name: "shadow-software/agt-php-sdk"
          package_dir: "."
          version: ${{ github.event.client_payload.version || inputs.version }}
          dry_run: ${{ inputs.dry_run && 'true' || 'false' }}
          npm_token: ${{ secrets.NPM_TOKEN }}
          packagist_token: ${{ secrets.PACKAGIST_TOKEN }}
          packagist_username: ${{ secrets.PACKAGIST_USERNAME }}
          consumer_repo: "agt-for-woocommerce"
          consumer_dispatch_token: ${{ secrets.PLUGIN_DISPATCH_TOKEN }}
