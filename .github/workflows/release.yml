name: Release

on:
  repository_dispatch:
    types: [spec-updated]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (SDK-only patch, e.g. 3.2.1)"
        required: true
        type: string
      dry_run:
        description: "Build and test but do not publish"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Generate, build, test, publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SDK package
        uses: actions/checkout@v7

      - name: Checkout private sdk-release (scripts + composite action)
        uses: actions/checkout@v7
        with:
          repository: shadow-software/sdk-release
          path: .sdk-release
          token: ${{ secrets.SDK_RELEASE_TOKEN }}

      - name: Generate, build, test, publish
        uses: ./.sdk-release/.github/actions/release
        with:
          language: php
          package_name: "shadow-software/agt-php-sdk"
          package_dir: "."
          version: ${{ github.event.client_payload.version || inputs.version }}
          dry_run: ${{ inputs.dry_run && 'true' || 'false' }}
          npm_token: ${{ secrets.NPM_TOKEN }}
          packagist_token: ${{ secrets.PACKAGIST_TOKEN }}
          packagist_username: ${{ secrets.PACKAGIST_USERNAME }}

      # agt-for-woocommerce depends on this package via Composer. A real
      # publish (never on dry_run) hands it off so the plugin release is
      # hands-off too, instead of waiting on someone to notice a new SDK
      # version and bump the plugin by hand. continue-on-error: the publish
      # above already succeeded — a missing/rotated PLUGIN_DISPATCH_TOKEN
      # should not turn a real SDK release into a failed CI run.
      - name: Notify agt-for-woocommerce of the new SDK version
        if: ${{ success() && inputs.dry_run != true }}
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.PLUGIN_DISPATCH_TOKEN }}
        run: |
          version="${{ github.event.client_payload.version || inputs.version }}"
          curl -sSf -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/shadow-software/agt-for-woocommerce/dispatches" \
            -d "{\"event_type\":\"php-sdk-released\",\"client_payload\":{\"version\":\"${version}\"}}"
